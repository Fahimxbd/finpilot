[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finpilot-toolkit"
version = "0.1.0"
description = "Open-source AI-assisted financial operations toolkit for educational decision support."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "FinPilot contributors"}]
dependencies = [
  "PyYAML>=6.0,<7.0",
  "filelock>=3.13,<4.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "yfinance>=0.2.40,<1.0",
  "feedparser>=6.0,<7.0",
  "pypdf>=5.0,<7.0",
  "requests>=2.31,<3.0",
  "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
finpilot = "finpilot_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["finpilot_cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
core = ["default_limits.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
